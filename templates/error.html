{% extends 'base.html' %}
{% block title %}{{ code }} - Dayflow HRMS{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 1rem;">
  <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;"></i>
  <h3 class="fw-bold mt-3">{{ code }}</h3>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-2">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="text-center">
    <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:var(--primary);"></i>
    <h3 class="fw-bold mt-3">{{ code }}</h3>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('login') }}" class="btn btn-primary mt-2">Go to Login</a>
  </div>
</div>
{% endblock %}
